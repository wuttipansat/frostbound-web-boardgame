<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FROSTBOUND</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="fx-layer" aria-live="polite"></div>

  <header id="topbar"></header>
  <div id="phase" aria-live="polite"></div>
  <aside id="log" class="feed" aria-live="polite"></aside>
  <aside id="locpanel" class="panel hidden"></aside>

  <div id="pp-survivors" class="sv-tokens" aria-label="Survivors"></div>
  <div id="dice-stage" aria-hidden="true"><canvas id="dice"></canvas></div>
  <section id="player" class="panel hidden">
    <div id="pp-head"></div>
    <div class="pp-body">
      <div class="pp-dice">
        <div id="pp-chips"></div>
      </div>
      <div id="pp-hand"></div>
      <div id="pp-actions"></div>
    </div>
  </section>

  <div id="modal"></div>
  <div id="toasts" aria-live="assertive"></div>
  <div id="tutorial"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
